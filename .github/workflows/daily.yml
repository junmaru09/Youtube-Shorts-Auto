# The daily build: research through assembly.
#
# Publishing and going public are deliberately *not* automated. The human review
# gate and the check in YouTube Studio are what YouTube's 2025 policy asks for
# when it says a channel must show editorial involvement, and an unattended
# upload would remove exactly that.
#
# Manual-dispatch only until the operator is ready. Before enabling `schedule`:
#
#   1. Repository secrets: ANTHROPIC_API_KEY, and GCP_TTS_KEY if narration is
#      to run here rather than locally.
#   2. Somewhere to keep work/ between runs. GitHub's runners start empty, so
#      without persistence every run re-plans from scratch: the dedup history is
#      gone, the theme allocation resets, and the spend ledger the budget guard
#      reads is empty. The cache below is a stopgap, not a guarantee — caches
#      are evicted. For real operation use a self-hosted runner or external
#      storage.

name: daily

on:
  workflow_dispatch:
    inputs:
      theme:
        description: テーマを固定する（空なら配分に従って抽選）
        required: false
      provider:
        description: 音声（google / silent）。silent なら無音で経路だけ確認する
        default: silent
  # schedule:
  #   - cron: "0 21 * * *"   # 06:00 JST

concurrency:
  group: tube-auto-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and a CJK font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk

      - name: Install the package
        run: pip install -e ".[dev]"

      - name: Restore pipeline state
        uses: actions/cache@v4
        with:
          path: work
          key: tube-auto-state-${{ github.run_id }}
          restore-keys: tube-auto-state-

      - name: Authenticate to Google Cloud for narration
        if: ${{ inputs.provider == 'google' }}
        run: |
          echo '${{ secrets.GCP_TTS_KEY }}' > "$RUNNER_TEMP/gcp.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp.json" >> "$GITHUB_ENV"

      - name: Diagnose the setup
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: tube-auto doctor

      - name: Build one video
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          tube-auto build \
            ${{ inputs.theme && format('--theme {0}', inputs.theme) || '' }} \
            --provider "${{ inputs.provider || 'silent' }}"

      - name: Report what is waiting for a human
        if: always()
        run: tube-auto status

      - name: Keep the render for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-${{ github.run_id }}
          path: |
            work/renders
            work/logs
          retention-days: 14
