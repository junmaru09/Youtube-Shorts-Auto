# ミニチュア救助（Tiny World Rescue）。
# 参照実例: https://www.youtube.com/shorts/4m---XnpfxI (miniworld.80)
#           https://www.youtube.com/shorts/8JugFY-9UHw
#           https://www.youtube.com/shorts/tVIC1zQAcHc
# 感情フックが強く数千万再生規模の実績。明確にフィクションなので誤認リスクは低い。
#
# made_for_kids に注意: ミニチュアと救助という題材は子ども向けと判定されうる。
# 誤申告は YPP 違反なので、実際の視聴者層を見て見直すこと。

id: miniature_rescue
enabled: true
languages: [ja, en]
description: ミニチュアの村を巨大な人間の手が救う、箱庭スケールの救助劇
made_for_kids: false

style: >
  Hyper-realistic miniature diorama, tilt-shift realism, warm practical
  lighting, tactile materials, visible scale cues.

prompt_template: |
  {cinematography}. {subject}, {action}, {context}.
  {style}
  Audio: {audio}

negative_prompt: >
  injured figurine, broken doll body, blood, real disaster footage, news
  chyron, recognizable real place, brand logo

title_patterns:
  ja:
    - "巨大な手がミニチュアの村を救った"
    - "{disaster}に沈む小さな町を助けてみた"
    - "小さな世界の{disaster}を止める方法"
    - "ミニチュアの村が{disaster}から立ち直るまで"
  en:
    - "Giant hand saves a tiny village from {disaster}"
    - "Tiny world {disaster} rescue"
    - "A giant hand helped a tiny world"

hashtags:
  ja: ["#ミニチュア", "#癒し", "#AI動画", "#shorts"]
  en: ["#miniature", "#satisfying", "#aivideo", "#shorts"]

subject_pool:
  - a flooded miniature farming village
  - a tiny wooden bridge cracked in half
  - a miniature house with a collapsed roof
  - a small village cut off by a mudslide
  - a tiny harbour hit by a storm surge
  - a miniature power line brought down by wind
  - a small greenhouse buried in snow
  - a model waterwheel jammed with debris

banned:
  - ミニチュアの人形が負傷・死亡する描写
  - 実在の災害・被災地の再現
  - 実在ブランド・ロゴ
  - 実在人物の登場

video:
  model: veo-3.1-lite-generate-preview
  duration_seconds: 8
  aspect_ratio: "9:16"
  resolution: "720p"
  generate_audio: true
