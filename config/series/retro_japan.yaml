# 歴史復元・タイムスリップ（日本語チャンネル専用）。
# 実例: https://www.youtube.com/shorts/gBBlm_hEvlI (写真復活)
#       https://www.youtube.com/@タイムスリップ日本
# 教養・ノスタルジー寄りで審査に通りやすい。日本語圏固有の需要。
# 唯一の言語依存シリーズ（英語チャンネルには流さない）。

id: retro_japan
enabled: true
weight: 1.0
language_independent: false
languages: [ja]
description: 昭和・大正の日本の日常をAIで再現するタイムスリップ映像

title_patterns:
  ja:
    - "{era}の{place}にタイムスリップしてみた"
    - "AIで蘇る{era}の{place}"
    - "{era}の人はこんな暮らしをしていた"

hashtags:
  ja: ["#昭和レトロ", "#タイムスリップ", "#shorts"]

prompt_template: |
  Vertical 9:16, period-accurate reconstruction shot like restored home-movie film.
  {scene}
  Slight film grain, gentle gate weave, muted period-correct colour palette.
  No text overlay, no watermark, no modern objects, no logos.

subject_pool:
  - a shopping street at dusk in 1950s Tokyo
  - a wooden tram stop on a rainy morning
  - a public bathhouse entrance in winter
  - a fishing harbour at dawn
  - a rice field at planting season
  - a school courtyard at lunch break
  - a night stall serving noodles

banned:
  - 実在人物の再現（本人と特定できる描写）
  - 戦争・災害の被害描写
  - 史実として断定する説明（あくまで「イメージ」と示す）
  - 実在ブランド・企業ロゴ

video:
  model: veo-3.1-lite-generate-preview
  duration_seconds: 8
  aspect_ratio: "9:16"
  resolution: "720p"
  generate_audio: true
