# 読み上げ用の読み辞書。
#
# Google の日本語TTSは、指数表記・単位記号・カタログ名・読みの割れる漢字を
# 誤読する。公式の対処はIPA指定だが、目視でレビューできないため採用していない。
# 代わりに台本の段階で読みを確定させ、その差分をここに置く。
#
# 運用: 完成した動画を試聴して誤読を見つけたら、ここに1行足す。
# ビルトインの読み（src/tube_auto/reading.py の BUILTIN_READINGS）より
# このファイルが優先される。

readings:
  # --- 天体・カタログ名 ---
  "JWST": "ジェイムズウェッブ宇宙望遠鏡"
  "TESS": "テス"
  "ALMA": "アルマ望遠鏡"
  "LIGO": "ライゴ"
  "Virgo": "ヴァーゴ"
  "KAGRA": "カグラ"
  "Gaia": "ガイア"
  "Chandra": "チャンドラ"
  "Kepler": "ケプラー"
  "TRAPPIST": "トラピスト"
  "Proxima": "プロキシマ"
  "Betelgeuse": "ベテルギウス"
  "Sagittarius A*": "いて座エースター"
  "M87*": "エムハチジュウナナスター"

  # --- 単位（曖昧さがないものは辞書で解決する。
  #      分数や比は文脈次第なので、台本側で読みを書かせる） ---
  "kg": "キログラム"
  "km": "キロメートル"
  "cm": "センチメートル"
  "mm": "ミリメートル"
  "nm": "ナノメートル"
  "μm": "マイクロメートル"
  "GHz": "ギガヘルツ"
  "MHz": "メガヘルツ"
  "pc": "パーセク"
  "kpc": "キロパーセク"
  "Mpc": "メガパーセク"
  "au": "天文単位"
  "eV": "電子ボルト"
  "keV": "キロ電子ボルト"
  "MeV": "メガ電子ボルト"
  "GeV": "ギガ電子ボルト"
  "Hz": "ヘルツ"
  "kHz": "キロヘルツ"
  "K": "ケルビン"

  # --- 記号 ---
  "±": "プラスマイナス"
  "≈": "およそ"
  "≒": "およそ"
  "~": "およそ"
  "→": "から"

  # --- 読みが割れる漢字 ---
  "重水素": "じゅうすいそ"
  "陽子": "ようし"
  "中性子": "ちゅうせいし"
  "電離": "でんり"
  "輻射": "ふくしゃ"
  "潮汐": "ちょうせき"
  "歳差": "さいさ"
  "離心率": "りしんりつ"
  "近日点": "きんじつてん"
  "遠日点": "えんじつてん"
  "食変光星": "しょくへんこうせい"
  "散開星団": "さんかいせいだん"
  "球状星団": "きゅうじょうせいだん"
  "暗黒物質": "あんこくぶっしつ"
  "対消滅": "ついしょうめつ"
  "反物質": "はんぶっしつ"
