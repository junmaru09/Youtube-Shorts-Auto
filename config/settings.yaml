# 方針C（小規模実験）の既定値。
# 「当たりが見えたら拡大、見えなければ数万円で止める」ための上限をここで強制する。

budget:
  # 月次の総支出上限（USD）。動画生成と企画LLMの両方を含む。超えると生成を拒否する。
  monthly_usd: 75.0
  # 1回の generate 実行で使ってよい上限（USD）。暴走時のブレーキ。
  per_run_usd: 5.0

pipeline:
  # 1日に企画する本数。1企画 = 1動画 = 1チャンネルなので、
  # publish_per_day を超えないこと（超えると未投稿の在庫が積み上がる）。
  ideas_per_day: 3
  # 1日に投稿する本数。YouTube Data API は 10,000 units/日 かつ
  # videos.insert = 1600 units なので物理上限は 6 本/日。
  publish_per_day: 3
  # 生成失敗時に同一企画を再試行してよい回数
  max_retries_per_idea: 2

video:
  # 既定バックエンド。backends/ の登録名。
  backend: veo
  model: veo-3.1-lite-generate-preview
  duration_seconds: 8
  aspect_ratio: "9:16"
  resolution: "720p"
  generate_audio: true
  # text-to-video は allow_all のみ対応。EU/UK/CH/MENA からは allow_adult のみ。
  person_generation: allow_all
  # 全シリーズ共通の否定指示。シリーズ側の negative_prompt とマージされる。
  # 否定はここに書く（ポジティブプロンプトに書くと逆効果になると公式が明示している）。
  negative_prompt: >
    text overlay, subtitles, captions, watermark, logo, on-screen graphics,
    speech, dialogue, narration, voiceover, singing,
    blurry, low quality, distorted anatomy, extra limbs

llm:
  # 企画生成に使うモデル
  model: claude-sonnet-5
  max_tokens: 4096
  # 直近この件数の企画を「重複を避けろ」の参考として LLM に渡す
  recent_context_size: 40

postprocess:
  # タイトル焼き込み用フォント。未設定なら Noto Sans CJK を自動検出する。
  # CJK非対応フォントへのフォールバックはしない（日本語が豆腐になるため）。
  font_path: null
  font_size: 64
  # ラウドネス正規化のターゲット（LUFS）。YouTube の基準に合わせる。
  loudness_target: -14.0

review:
  # 却下理由タグ。Streamlit のボタンと、次回の企画生成へのフィードバックに使う。
  reason_tags:
    - 映像が破綻している
    - フックが弱い
    - 既出と似すぎ
    - ポリシー的に危ない
    - 音声が不自然
    - 文字や透かしが焼き込まれている

publish:
  # 最初は必ず private で上げ、目視確認後に `shorts-auto go-live` で公開する。
  initial_privacy: private
  category_id: "24" # Entertainment
  # 同じ企画のアップロードがこの回数失敗したら諦める。
  # そうしないとキューの先頭に居座り、毎回1日の上限枠を食い潰す。
  max_upload_failures: 3

report:
  # 収益化ライン: 直近90日で 1,000万ショート再生
  monetization_views_90d: 10000000
  # 損益分岐の判定に使う RPM レンジ（USD / 1,000 views）
  rpm_low: 0.03
  rpm_high: 0.10
  # 各腕がこの本数に達するまでは配分を均等にし、判定も出さない（探索優先）。
  min_samples_before_weighting: 10
  # 全腕に保証する最低配分。ただし合計が予算の半分を超えないよう
  # 0.5/腕数 で自動的に頭打ちになる（6腕なら実効8.3%）。
  min_weight_share: 0.15
