# 長尺（15〜20分）の科学解説チャンネルを1日1本、月5,000円以内で回すための設定。
#
# 目標: コストを差し引いて月30,000円。粗収益35,000円。
# 最大の関門は収益化ゲート（直近12ヶ月で総再生時間4,000時間）で、
# 実測ベースの逆算では約85本が必要になる。

budget:
  # 月次の総支出上限（USD）。画像生成・LLM・TTS超過分をすべて含む。
  # ¥5,000 ≒ $33。実測の想定使用額は $8.8/月なので3倍以上の余裕がある。
  monthly_usd: 33.0
  # 1回の実行で使ってよい上限（USD）。暴走時のブレーキ。
  per_run_usd: 3.0

pipeline:
  # 1日に企画する本数
  ideas_per_day: 1
  # 生成失敗時に同一企画を再試行してよい回数
  max_retries_per_idea: 2

# 投稿ペースのランプアップ。
#
# 開設直後にいきなり毎日投稿すると、視聴・登録の履歴がない新規アカウントは
# スパムを疑われる。「改善なき大量投稿は逆効果」でもある。
# 4,000時間の到達は2.8ヶ月→3.5ヶ月に遅れるが、凍結リスクを下げる方を取る。
#
# チャンネル開設から投稿開始までは2週間ほど空け、その間は普通に視聴・登録して
# 履歴を作っておくこと。
publish:
  ramp_up:
    - { until_day: 14, per_week: 3 }   # 1〜2週目
    - { until_day: 28, per_week: 5 }   # 3〜4週目
    - { until_day: null, per_week: 7 } # 以降は毎日
  # API上限は 10,000 units/日、videos.insert が 1,600 units なので 6本/日。
  hard_daily_cap: 6
  initial_privacy: private
  category_id: "28"  # Science & Technology
  max_upload_failures: 3
  # 開設日（YYYY-MM-DD）。ランプアップの起点。未設定なら最初の投稿日を使う。
  channel_started_on: null

video:
  target_minutes: 18
  width: 1920
  height: 1080
  fps: 30
  # 素材の配分。NASAの動画在庫は7,559件と少なく、理論系（ブラックホール51件、
  # 重力波3件）はすぐ枯渇するため、静止画と図解を主役にする。
  # 静止画は166,793件あるので枯渇しない。
  composition:
    footage: 0.30   # NASA実映像。最も印象的な場面に絞る
    still: 0.40     # NASA静止画 + Ken Burns
    diagram: 0.25   # matplotlib アニメーション + 概念図
    title: 0.05     # 章タイトル・オープニング
  # 1カットの長さ（秒）。短すぎると散漫、長すぎると飽きる。
  cut_seconds: { min: 6, max: 14 }

research:
  # 1本につきこの本数の一次ソースを束ねる。1本では内容が薄くなる。
  sources_per_video: { min: 3, max: 5 }
  # 直近この件数のソースURLを「使用済み」として除外する
  recent_source_memory: 500
  arxiv_max_age_days: 30
  nasa_max_age_days: 365

llm:
  research_model: claude-sonnet-5
  script_model: claude-sonnet-5
  max_tokens: 16000
  # 直近この件数の企画要約を渡して重複を避けさせる
  recent_context_size: 40

tts:
  provider: google
  # Chirp 3 HD。月100万文字まで無料。月30本×9,000文字=27万文字で枠内。
  voice_model: Chirp3-HD
  language_code: ja-JP
  sample_rate: 24000
  free_tier_chars_per_month: 1000000
  # 無料枠のこの割合を超えたら doctor が警告する
  free_tier_warn_at: 0.8

images:
  # NASAに素材がない理論系の概念図を補う
  provider: gemini
  model: gemini-2.5-flash-image
  concepts_per_video: 20
  thumbnails_per_video: 3

postprocess:
  font_path: null       # 未設定なら Noto Sans CJK を自動検出
  loudness_target: -14.0
  # BGMは YouTube オーディオライブラリから事前取得したものを work/bgm/ に置く
  bgm_dir: work/bgm
  bgm_gain_db: -22.0

review:
  reason_tags:
    - 事実が怪しい
    - 出典と内容が合っていない
    - 読み間違いがある
    - 映像と話が合っていない
    - 図解が破綻している
    - 冒頭が弱い
    - 既出と似すぎ

report:
  # 収益化ゲート: 直近12ヶ月で総再生時間4,000時間
  monetization_watch_hours: 4000
  # 実測から逆算した必要本数
  videos_to_gate: 85
  # 目標: 手残り月30,000円 → 粗35,000円
  target_gross_jpy: 35000
  # RPMの初期値（円/1,000再生）。日本の長尺は150〜450円と幅が広いので、
  # 初月の実測が出たらそちらで置き換える。
  assumed_rpm_jpy: { low: 150, mid: 300, high: 450 }
  jpy_per_usd: 150
  # 各腕がこの本数に達するまでは配分を均等にし、判定も出さない
  min_samples_before_weighting: 8
  min_weight_share: 0.15
  # 視聴維持率がこれを下回ったら構成に問題がある
  retention_floor: 0.30
